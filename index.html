<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DailyFlow - Routine & Productivity Tracker</title>
<style>
:root{--bg:#0a0a10;--card:#161622;--card2:#1d1d2d;--line:#282839;--tx:#ececf6;--mut:#8d8da6;--a1:#7c5cff;--a2:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,#7c5cff26,transparent),radial-gradient(700px 400px at -10% 10%,#3b82f622,transparent),var(--bg);background-attachment:fixed}
body.lock{overflow:hidden}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:230px 1fr;max-width:1180px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:800;font-size:21px;padding:6px 14px 20px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--mut);background:none;border:0;font-weight:600;text-align:left;transition:.2s}
.nav:hover{color:var(--tx)}
.nav.on{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.nav.on svg{color:var(--a1)}
.bottom{display:none}
main{padding:24px 20px 110px;min-width:0;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}.side{display:none}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0d0d15ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .bottom .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 4px;align-items:center}
 main{padding:16px 14px 110px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
h2{font-size:18px;margin-bottom:4px}h3{font-size:17px;margin-bottom:12px}
.muted{color:var(--mut);font-size:13px}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;background:linear-gradient(135deg,#7c5cff2e,#3b82f61f),var(--card);flex-wrap:wrap}
.hello{font-size:24px;font-weight:800}
.date{color:var(--mut);margin-top:2px}
.quote{margin-top:12px;font-style:italic;color:#cfcfe6;max-width:520px}
.clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;background:linear-gradient(90deg,#fff,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.stat b{display:block;font-size:28px;margin-top:2px}
.stat.acc b{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.progtop{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:600}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--ok));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 13px;font:inherit;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px #7c5cff33}
input[type=color]{padding:2px;height:42px;width:56px}
input[type=checkbox]{width:auto}
.toolbar input[type=search]{flex:2 1 200px}.toolbar select{flex:1 1 130px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);padding:10px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.btn:hover{border-color:var(--a1)}
.btn.primary{background:linear-gradient(135deg,var(--a1),var(--a2));border:0;color:#fff;box-shadow:0 6px 20px #7c5cff55}
.btn.danger{background:#ef444422;border-color:#ef444466;color:#ff9a9a}
.btn.sm{padding:7px 12px;font-size:13px}
.fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 8px 24px #7c5cff77;z-index:15;display:none;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}
@media(max-width:820px){.fab{display:flex}}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px;width:fit-content}
.tab{border:0;background:none;padding:9px 16px;border-radius:10px;color:var(--mut);font-weight:600}
.tab.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.tab em{font-style:normal;opacity:.85;margin-left:4px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:.28s;animation:fade .3s ease}
.task:hover{border-color:#3a3a54}
.task.leaving{opacity:0;transform:translateX(40px) scale(.97);max-height:0;padding-top:0;padding-bottom:0;margin:0;overflow:hidden}
.check{width:26px;height:26px;border-radius:50%;border:2px solid #4a4a66;background:none;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;color:transparent;transition:.2s}
.check:hover{border-color:var(--ok);color:var(--ok)}
.task.isdone .check{background:var(--ok);border-color:var(--ok);color:#06210f}
.check svg{width:15px;height:15px;stroke-width:3}
.tbody{flex:1;min-width:0}
.ttitle{font-weight:600;word-break:break-word}
.task.isdone .ttitle{text-decoration:line-through;color:var(--mut)}
.tdesc{color:var(--mut);font-size:13px;margin-top:2px;word-break:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,#888) 20%,transparent);color:var(--c,#aaa);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.chip svg{width:12px;height:12px}
.chip.t{--c:#a9a9c4}.chip.high{--c:#ff6b6b}.chip.medium{--c:#fbbf24}.chip.low{--c:#4ade80}.chip.over{--c:#fb923c}
.tact{display:flex;gap:2px}
.icon{background:none;border:0;color:var(--mut);padding:7px;border-radius:10px}
.icon:hover{background:var(--card2);color:var(--tx)}
.icon.del:hover{color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-size:18px;color:var(--tx);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:flex-end;margin-top:16px}.row.sp{justify-content:space-between;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
@media(max-width:560px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:94vh}}
.sheet label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px;font-weight:600}
.sheet label input,.sheet label select,.sheet label textarea{margin-top:5px;color:var(--tx);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daysrow{display:flex;gap:6px;margin-bottom:12px}
.dchip{margin:0!important;flex:1}
.dchip input{display:none}
.dchip span{display:block;text-align:center;padding:9px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer;color:var(--tx)}
.dchip input:checked+span{background:var(--a1);border-color:var(--a1)}
.pick{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pick:last-of-type{border:0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.warn{background:#f59e0b22;border:1px solid #f59e0b66;color:#fcd34d;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.note{background:#3b82f61a;border:1px solid #3b82f655;color:#b6d1ff;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.cell{aspect-ratio:1;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px;transition:.15s}
.cell small{font-size:10px;font-weight:500;opacity:.85}
.cell.blank{visibility:hidden}.cell.future{opacity:.4}
.cell.today{box-shadow:0 0 0 2px var(--a1)}.cell.sel{outline:2px solid #fff;outline-offset:1px}
.week{display:flex;gap:8px;align-items:flex-end;height:150px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--mut)}
.wbar{width:100%;max-width:40px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--a1),var(--a2));transition:height .7s}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.focus{position:fixed;inset:0;z-index:60;background:radial-gradient(700px 500px at 50% 0,#7c5cff33,transparent),#07070c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fade .3s}
.focus h1{font-size:clamp(26px,6vw,44px);margin:10px 0;max-width:760px;word-break:break-word}
.ftimer{font-size:clamp(56px,16vw,110px);font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#fff,#b9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:18px 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#262638;border:1px solid var(--line);padding:11px 18px;border-radius:99px;box-shadow:0 8px 30px #000a;animation:fade .25s;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">DailyFlow</div><div id="navSide"></div></aside>
  <main id="main"></main>
</div>
<nav class="bottom" id="navBottom"></nav>
<div id="modal" class="modal hidden"></div>
<div id="focus" class="focus hidden"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" class="hidden">

<script>
(() => {
'use strict';
const TZ = 'Asia/Kolkata';           // India Standard Time
const KEY = 'dailyflow_v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- icons ---------- */
const P = {
  check:'<path d="M5 12l5 5 9-10"/>', edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  undo:'<path d="M3 7v6h6M3 13a9 9 0 1 0 3-7"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
  focus:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>', trade:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  gear:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  back:'<path d="M3 12h18M3 12l6-6M3 12l6 6"/>'
};
const ic = n => `<svg viewBox="0 0 24 24">${P[n]}</svg>`;

/* ---------- date helpers (everything in IST) ---------- */
function nowParts() {
  const f = new Intl.DateTimeFormat('en-GB', {timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  const p = {}; f.formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  if (p.hour === '24') p.hour = '00';
  return p;
}
const todayStr = () => { const p = nowParts(); return `${p.year}-${p.month}-${p.day}`; };
const nowHM = () => { const p = nowParts(); return `${p.hour}:${p.minute}`; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = s => new Date(s + 'T00:00:00Z').getUTCDay();
const diffDays = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const fmtLong = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'UTC'});
const fmtShort = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'});
const DOWN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt12(hm) { if (!hm) return ''; const [h, m] = hm.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h < 12 ? 'AM' : 'PM'}`; }

/* ---------- data ---------- */
const QUOTES = [
 'Small steps every day add up to big results.','Discipline is choosing what you want most over what you want now.',
 'You do not have to be extreme, just consistent.','Win the morning, win the day.','Progress, not perfection.',
 'The best time to start was yesterday. The next best time is now.','Do something today that your future self will thank you for.',
 'Motivation gets you started. Habit keeps you going.','One task at a time. One day at a time.',
 'Your routine shapes your results.','Consistency beats intensity.','Focus on the process and the results will follow.',
 'Protect your time like you protect your money.','Be patient with yourself, but never stop showing up.',
 'A calm mind makes better decisions.','Plan the work, then work the plan.','Show up even when you do not feel like it.',
 'Every checkmark is a vote for the person you want to become.','Rest is part of the routine too.','Start before you feel ready.',
 'Good habits are built in ordinary moments.','Make today count.','Done is better than perfect.','Control the controllables.',
 'Risk management first, everything else second.','Learn a little every day.','Energy flows where attention goes.',
 'Keep promises you make to yourself.','Trust the routine.','Finish what you started today.','Great things take time. Keep going.'
];
const defaults = () => ({
  v: 1, name: '',
  categories: [
    {id:'morning', name:'Morning Routine', color:'#f59e0b'}, {id:'trading', name:'Trading', color:'#22c55e'},
    {id:'learning', name:'Learning', color:'#3b82f6'}, {id:'personal', name:'Personal', color:'#a855f7'},
    {id:'health', name:'Health', color:'#14b8a6'}, {id:'evening', name:'Evening Routine', color:'#6366f1'},
    {id:'custom', name:'Custom Category', color:'#ec4899'}
  ],
  templates: [],              // recurring tasks
  days: {},                   // 'YYYY-MM-DD': {tasks:[...], init:bool}
  checklist: {items: [], checks: {}},
  seeded: false
});
function normalize(d) {
  const b = defaults(), o = Object.assign(b, d);
  if (!Array.isArray(o.categories) || !o.categories.length) o.categories = defaults().categories;
  if (!Array.isArray(o.templates)) o.templates = [];
  if (!o.days || typeof o.days !== 'object') o.days = {};
  if (!o.checklist || !Array.isArray(o.checklist.items)) o.checklist = {items: [], checks: {}};
  if (!o.checklist.checks) o.checklist.checks = {};
  Object.values(o.days).forEach(x => { if (!Array.isArray(x.tasks)) x.tasks = []; });
  return o;
}
let storageOK = true;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return normalize(JSON.parse(r)); }
  catch (e) { console.error(e); }
  return defaults();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; toast('Could not save data in this browser'); }
}
let S = load();
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOK = false; }

const catOf = id => S.categories.find(c => c.id === id) || {id:'', name:'Uncategorized', color:'#6b7280'};
const PRI = {high:0, medium:1, low:2};
const byTime = (a, b) => ((a.time || '99:99') < (b.time || '99:99') ? -1 : (a.time || '99:99') > (b.time || '99:99') ? 1 : (PRI[a.pri] ?? 1) - (PRI[b.pri] ?? 1));

function matches(t, date) {
  if (date < t.start) return false;
  if (t.type === 'daily') return true;
  if (t.type === 'weekly') return (t.days || []).includes(dow(date));
  if (t.type === 'custom') return diffDays(t.start, date) % (t.interval || 1) === 0;
  return false;
}
const inst = t => ({id: uid(), title: t.title, desc: t.desc || '', time: t.time || '', cat: t.cat, pri: t.pri || 'medium', done: false, tpl: t.id});
// Creates today's list (and adds recurring tasks) the first time a date is opened.
function ensureDay(date) {
  let d = S.days[date];
  if (!d) d = S.days[date] = {tasks: [], init: false};
  if (!d.init) {
    S.templates.forEach(t => { if (matches(t, date) && !d.tasks.some(k => k.tpl === t.id)) d.tasks.push(inst(t)); });
    d.init = true; save();
  }
  return d;
}
function dayStats(date) {
  const tasks = (S.days[date] && S.days[date].tasks) || [];
  const done = tasks.filter(t => t.done).length;
  return {total: tasks.length, done, pending: tasks.length - done, pct: tasks.length ? Math.round(done / tasks.length * 100) : 0};
}
function streak() {
  const t = todayStr(); let d = dayStats(t).done > 0 ? t : addDays(t, -1), n = 0;
  while (dayStats(d).done > 0) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak() {
  const ks = Object.keys(S.days).filter(k => dayStats(k).done > 0).sort();
  let best = 0, run = 0, prev = null;
  for (const k of ks) { run = prev && diffDays(prev, k) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = k; }
  return best;
}
function seed() {
  const t = todayStr();
  const mk = (title, time, cat, pri = 'medium') => ({id: uid(), title, desc: '', time, cat, pri, done: false});
  S.days[t] = {init: false, tasks: [
    mk('Wake up at 5:15 AM','05:15','morning','high'), mk('Drink water','05:20','health'), mk('Freshen up','05:30','morning'),
    mk('Exercise','06:00','health','high'), mk('Plan my day','07:00','morning','high'),
    mk('Check the market','08:30','trading','high'), mk('Analyze market trends','08:45','trading'),
    mk('Identify trading opportunities','09:00','trading'), mk('Check my trading setup','09:10','trading'),
    mk('Review risk management rules','09:20','trading','high'), mk('Maintain a trading journal','15:45','trading'),
    mk('Learn something new','17:00','learning'), mk('Work on my goals','18:00','personal','high'), mk('Read a book','20:00','learning','low'),
    mk("Review the day's performance",'21:00','evening'), mk("Plan tomorrow's tasks",'21:15','evening'), mk('Sleep on time','22:00','evening','high')
  ]};
  S.checklist.items = ['Check market conditions','Identify important support and resistance levels','Confirm my trading strategy conditions','Check risk-to-reward ratio','Set risk limits','Record my trade in my journal'].map(text => ({id: uid(), text}));
  S.seeded = true; save();
}

/* ---------- UI state ---------- */
const t0 = todayStr();
const ui = {view:'today', q:'', cat:'all', pri:'all', tab:'active', cal:{y:+t0.slice(0,4), m:+t0.slice(5,7) - 1}, sel:t0};
let lastDate = t0;

/* ---------- toast / modal ---------- */
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 2600);
}
function openModal(html) {
  const m = $('#modal'); m.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  m.classList.remove('hidden'); document.body.classList.add('lock');
  const f = m.querySelector('input[type=text],input:not([type]),textarea'); if (f) setTimeout(() => f.focus(), 60);
}
function closeModal() { const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; document.body.classList.remove('lock'); }
function confirmBox(msg, label, cb) {
  openModal(`<h3>Are you sure?</h3><p class="muted" style="font-size:14px">${esc(msg)}</p><div class="row end"><button class="btn" data-act="close">Cancel</button><button class="btn danger" id="okBtn">${esc(label)}</button></div>`);
  $('#okBtn').onclick = () => { closeModal(); cb(); };
}
function askText(title, val, cb) {
  openModal(`<h3>${esc(title)}</h3><form id="mForm"><input name="v" maxlength="200" value="${esc(val)}" required><div class="row end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save</button></div></form>`);
  $('#mForm').onsubmit = e => { e.preventDefault(); const v = new FormData(e.target).get('v').trim(); if (!v) return; closeModal(); cb(v); };
}

/* ---------- task modal (add / edit / recurring) ---------- */
function taskModal(o) {
  const x = o.task || {}, mode = o.mode, today = todayStr(), withRep = mode !== 'edit-task';
  const rp = mode === 'edit-tpl' ? x : {type: o.rep || 'once', days: [], interval: 2};
  const types = [['once','Does not repeat'],['daily','Every day'],['weekly','Weekly (choose days)'],['custom','Custom (every N days)']].filter(r => mode === 'add' || r[0] !== 'once');
  openModal(`<h3>${mode === 'add' ? 'Add task' : mode === 'edit-task' ? 'Edit task' : 'Edit recurring task'}</h3>
  <form id="mForm">
   <label>Title<input name="title" maxlength="120" required value="${esc(x.title)}" placeholder="e.g. Read 10 pages"></label>
   <label>Description (optional)<textarea name="desc" rows="2" maxlength="400">${esc(x.desc)}</textarea></label>
   <div class="grid2"><label>Time<input type="time" name="time" value="${esc(x.time)}"></label>
   ${mode === 'add' ? `<label>Date<input type="date" name="date" min="${today}" value="${today}"></label>` : '<div></div>'}</div>
   <div class="grid2">
    <label>Category<select name="cat">${S.categories.map(c => `<option value="${esc(c.id)}" ${c.id === (x.cat || S.categories[0].id) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
    <label>Priority<select name="pri">${['high','medium','low'].map(p => `<option value="${p}" ${p === (x.pri || 'medium') ? 'selected' : ''}>${p[0].toUpperCase() + p.slice(1)}</option>`).join('')}</select></label>
   </div>
   ${withRep ? `<label>Repeat<select name="rtype">${types.map(r => `<option value="${r[0]}" ${r[0] === (rp.type || 'once') ? 'selected' : ''}>${r[1]}</option>`).join('')}</select></label>
   <div id="rWeekly" class="daysrow">${DOWN.map((d, i) => `<label class="dchip"><input type="checkbox" name="rd" value="${i}" ${(rp.days || []).includes(i) ? 'checked' : ''}><span>${d[0]}</span></label>`).join('')}</div>
   <label id="rCustom">Every how many days?<input type="number" name="rint" min="2" max="365" value="${rp.interval || 2}"></label>` : ''}
   <div class="row end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">${mode === 'add' ? 'Add task' : 'Save'}</button></div>
  </form>`);
  const f = $('#mForm');
  const sync = () => { if (!withRep) return; const v = f.rtype.value; $('#rWeekly').classList.toggle('hidden', v !== 'weekly'); $('#rCustom').classList.toggle('hidden', v !== 'custom'); };
  if (withRep) { f.rtype.onchange = sync; sync(); }
  f.onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData(f), title = (fd.get('title') || '').trim();
    if (!title) { toast('Please enter a title'); return; }
    const data = {title, desc: (fd.get('desc') || '').trim(), time: fd.get('time') || '', cat: fd.get('cat'), pri: fd.get('pri')};
    let rec = null;
    if (withRep) {
      const rt = fd.get('rtype');
      if (rt !== 'once') {
        rec = {type: rt, days: [], interval: 2};
        if (rt === 'weekly') { rec.days = fd.getAll('rd').map(Number); if (!rec.days.length) { toast('Pick at least one day'); return; } }
        if (rt === 'custom') rec.interval = Math.max(2, parseInt(fd.get('rint'), 10) || 2);
      }
    }
    if (mode === 'add') {
      let date = fd.get('date') || today; if (date < today) date = today;
      if (!rec) {
        const d = S.days[date] || (S.days[date] = {tasks: [], init: false});
        d.tasks.push(Object.assign({id: uid(), done: false}, data));
        toast(date === today ? 'Task added' : 'Task added for ' + fmtShort(date));
      } else {
        const tpl = Object.assign({id: uid(), start: date}, data, rec);
        S.templates.push(tpl);
        if (date === today && matches(tpl, today)) { const d = ensureDay(today); if (!d.tasks.some(k => k.tpl === tpl.id)) d.tasks.push(inst(tpl)); }
        toast('Recurring task created');
      }
    } else if (mode === 'edit-task') { Object.assign(o.task, data); toast('Task updated'); }
    else { Object.assign(o.task, data, rec); toast('Recurring task updated'); }
    save(); closeModal(); render();
  };
}

function ydayModal() {
  const today = todayStr(), y = addDays(today, -1), list = ((S.days[y] || {}).tasks || []).slice().sort(byTime);
  if (!list.length) { toast("No tasks recorded for yesterday"); return; }
  const have = ensureDay(today).tasks.map(k => (k.title + '|' + k.time).toLowerCase());
  openModal(`<h3>Add yesterday's tasks again</h3><p class="muted" style="margin-bottom:8px">Choose which tasks to copy into today.</p><form id="mForm">
   ${list.map((k, i) => { const dup = have.includes((k.title + '|' + k.time).toLowerCase());
     return `<label class="pick" style="margin:0"><input type="checkbox" name="p" value="${i}" ${dup ? 'disabled' : 'checked'}><span class="grow" style="color:var(--tx)">${esc(k.title)} <span class="muted">${fmt12(k.time)}${dup ? ' · already today' : ''}</span></span></label>`; }).join('')}
   <div class="row end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Add selected</button></div></form>`);
  $('#mForm').onsubmit = e => {
    e.preventDefault(); const idx = new FormData(e.target).getAll('p').map(Number); if (!idx.length) { toast('Nothing selected'); return; }
    const d = ensureDay(today);
    idx.forEach(i => { const k = list[i]; d.tasks.push({id: uid(), title: k.title, desc: k.desc || '', time: k.time || '', cat: k.cat, pri: k.pri || 'medium', done: false}); });
    save(); closeModal(); render(); toast(idx.length + ' task(s) added to today');
  };
}

const greetText = () => { const h = +nowParts().hour; return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (S.name ? ', ' + S.name : '') + ' 👋'; };
const quoteOfDay = () => { const n = diffDays('2026-01-01', todayStr()); return QUOTES[((n % QUOTES.length) + QUOTES.length) % QUOTES.length]; };
const warnHTML = () => storageOK ? '' : '<div class="warn">⚠ Your browser is not saving data. Open this page from a web address (see instructions) or turn off private mode.</div>';

function renderStats() {
  if (ui.view !== 'today' || !$('#sTotal')) return;
  const st = dayStats(todayStr()), s = streak();
  $('#sTotal').textContent = st.total; $('#sDone').textContent = st.done; $('#sPend').textContent = st.pending; $('#sPct').textContent = st.pct + '%';
  $('#barFill').style.width = st.pct + '%';
  $('#streakTxt').textContent = `🔥 ${s}-day streak`;
}
function taskHTML(k, today, isDone) {
  const c = catOf(k.cat), over = !isDone && k.time && k.time < nowHM();
  return `<div class="task ${isDone ? 'isdone' : ''}" data-tid="${k.id}">
   <button class="check" data-act="${isDone ? 'undo' : 'done'}" data-id="${k.id}" aria-label="${isDone ? 'Restore task' : 'Complete task'}">${ic('check')}</button>
   <div class="tbody"><div class="ttitle">${esc(k.title)}</div>${k.desc ? `<div class="tdesc">${esc(k.desc)}</div>` : ''}
    <div class="meta"><span class="chip" style="--c:${esc(c.color)}">${esc(c.name)}</span>
     ${k.time ? `<span class="chip t">${ic('clock')}${fmt12(k.time)}</span>` : ''}<span class="chip ${esc(k.pri || 'medium')}">${esc(k.pri || 'medium')}</span>
     ${k.tpl ? `<span class="chip t">${ic('repeat')}recurring</span>` : ''}${over ? '<span class="chip over">overdue</span>' : ''}
     ${isDone && k.doneAt ? `<span class="chip t">done ${new Date(k.doneAt).toLocaleTimeString('en-IN', {timeZone: TZ, hour: 'numeric', minute: '2-digit'})}</span>` : ''}</div></div>
   <div class="tact">${isDone ? '' : `<button class="icon" data-act="edit" data-id="${k.id}" aria-label="Edit">${ic('edit')}</button>`}<button class="icon del" data-act="del" data-id="${k.id}" aria-label="Delete">${ic('trash')}</button></div></div>`;
}
function renderLists() {
  const box = $('#lists'); if (!box || ui.view !== 'today') return;
  const day = ensureDay(todayStr()), q = ui.q.trim().toLowerCase();
  const ok = k => (!q || (k.title + ' ' + (k.desc || '')).toLowerCase().includes(q)) && (ui.cat === 'all' || k.cat === ui.cat) && (ui.pri === 'all' || k.pri === ui.pri);
  const active = day.tasks.filter(k => !k.done && ok(k)).sort(byTime);
  const done = day.tasks.filter(k => k.done && !k.cleared && ok(k)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const nPend = day.tasks.filter(k => !k.done).length, nDone = day.tasks.filter(k => k.done && !k.cleared).length;
  let body;
  if (ui.tab === 'active') {
    body = active.length ? active.map(k => taskHTML(k, true, false)).join('')
      : `<div class="empty"><b>${!day.tasks.length ? 'No tasks for today' : nPend === 0 ? '🎉 All tasks completed!' : 'No tasks match your filters'}</b>${!day.tasks.length ? 'Tap “Add task” or bring back yesterday’s tasks.' : nPend === 0 ? 'Great work. Check the Completed tab to review.' : 'Try clearing the search or filters.'}</div>`;
  } else {
    body = (done.length ? `<div class="row sp" style="margin-bottom:10px"><span class="muted">Completed tasks stay saved in History.</span><button class="btn sm danger" data-act="clear">Clear completed</button></div>` : '') +
      (done.length ? done.map(k => taskHTML(k, true, true)).join('') : '<div class="empty"><b>Nothing completed yet</b>Tick a task and it will appear here.</div>');
  }
  box.innerHTML = `<div class="tabs"><button class="tab ${ui.tab === 'active' ? 'on' : ''}" data-act="tab" data-id="active">Active<em>${nPend}</em></button><button class="tab ${ui.tab === 'done' ? 'on' : ''}" data-act="tab" data-id="done">Completed<em>${nDone}</em></button></div>${body}`;
}

  m.innerHTML = `${warnHTML()}<section class="card"><h2>Trading Checklist</h2><p class="muted">Your personal preparation checklist for ${fmtLong(t)}. Resets every day. This app gives no buy/sell signals and no financial advice.</p></section>
  <section class="card"><div class="progtop"><span>Preparation</span><span>${n}/${items.length} · ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></section>

   <div class="row end"><button class="btn sm" data-act="tc-reset">Uncheck all</button></div></section>`;
}

function chartHistory() {
  const t = todayStr(); let cols = '';
  for (let i = 6; i >= 0; i--) { const d = addDays(t, -i), st = dayStats(d); cols += `<div class="wcol"><span>${st.total ? st.pct + '%' : '-'}</span><div class="wbar" style="height:${4 + st.pct * 0.95}px"></div><span>${DOWN[dow(d)]}</span></div>`; }
  return cols;
}
function detailHTML(date) {
  const day = S.days[date] || {tasks: []}, st = dayStats(date), t = todayStr();
  const dn = day.tasks.filter(k => k.done).sort(byTime), pd = day.tasks.filter(k => !k.done).sort(byTime);
  const ck = S.checklist.checks[date] || {}, cn = S.checklist.items.filter(i => ck[i.id]).length;
  const li = (k, mark) => `<div class="list-item"><span style="color:${mark === '✓' ? 'var(--ok)' : 'var(--mut)'};font-weight:800">${mark}</span><div class="grow">${esc(k.title)}<div class="muted">${esc(catOf(k.cat).name)}${k.time ? ' · ' + fmt12(k.time) : ''}</div></div></div>`;
  return `<section class="card"><div class="row sp"><h3 style="margin:0">${fmtLong(date)}</h3><span class="chip" style="--c:${st.pct >= 70 ? '#22c55e' : st.pct >= 40 ? '#f59e0b' : '#ef4444'}">${st.done}/${st.total} done · ${st.pct}%</span></div>
   ${!st.total ? '<p class="muted" style="margin-top:12px">No tasks were recorded on this day.</p>' : ''}
   ${dn.length ? `<p class="muted" style="margin:14px 0 4px">Completed</p>${dn.map(k => li(k, '✓')).join('')}` : ''}
   ${pd.length ? `<p class="muted" style="margin:14px 0 4px">${date === t ? 'Still pending' : 'Not completed'}</p>${pd.map(k => li(k, '○')).join('')}` : ''}
   ${(cn || date === t) && S.checklist.items.length ? `<p class="muted" style="margin-top:14px">Trading checklist: ${cn}/${S.checklist.items.length} items done</p>` : ''}</section>`;
}
function renderHistory(m) {
  const t = todayStr(), {y, m: mo} = ui.cal;
  const first = new Date(Date.UTC(y, mo, 1)).getUTCDay(), dim = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  const label = new Date(Date.UTC(y, mo, 1)).toLocaleDateString('en-GB', {month: 'long', year: 'numeric', timeZone: 'UTC'});
  let cells = DOWN.map(d => `<div class="h">${d[0]}</div>`).join('') + '<div class="cell blank"></div>'.repeat(first);
  for (let d = 1; d <= dim; d++) {
    const ds = `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, st = dayStats(ds), fut = ds > t;
    const hue = Math.round(st.pct * 1.2);
    const style = st.total && !fut ? `background:hsla(${hue},65%,40%,.38);border-color:hsla(${hue},65%,50%,.7)` : '';
    cells += `<button class="cell ${ds === t ? 'today' : ''} ${ds === ui.sel ? 'sel' : ''} ${fut ? 'future' : ''}" style="${style}" data-act="cal-day" data-id="${ds}">${d}${st.total && !fut ? `<small>${st.pct}%</small>` : ''}</button>`;
  }
  const keys = []; for (let i = 0; i < 30; i++) keys.push(addDays(t, -i));
  const active30 = keys.filter(k => dayStats(k).done > 0).length;
  const w = keys.slice(0, 7).map(dayStats).filter(s => s.total), avg7 = w.length ? Math.round(w.reduce((a, s) => a + s.pct, 0) / w.length) : 0;
  const totalDone = Object.keys(S.days).reduce((a, k) => a + dayStats(k).done, 0);
  const mini = (l, v) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`;
  m.innerHTML = `${warnHTML()}<div class="minis">${mini('Current streak', '🔥 ' + streak())}${mini('Best streak', bestStreak())}${mini('7-day average', avg7 + '%')}${mini('Consistency (30d)', Math.round(active30 / 30 * 100) + '%')}${mini('Tasks completed', totalDone)}</div>
  <section class="card"><h2>Last 7 days</h2><p class="muted" style="margin-bottom:14px">Daily completion percentage</p><div class="week">${chartHistory()}</div></section>
  <section class="card"><div class="row sp" style="margin-bottom:12px"><button class="btn sm" data-act="cal-prev">‹</button><h3 style="margin:0">${label}</h3><button class="btn sm" data-act="cal-next">›</button></div><div class="cal">${cells}</div>
   <p class="muted" style="margin-top:12px">Colour: red = low completion, green = high. Tap a day for details.</p></section>
  ${detailHTML(ui.sel)}`;
}

function schedText(t) {
  if (t.type === 'daily') return 'Every day';
  if (t.type === 'weekly') return 'Every ' + (t.days || []).slice().sort().map(d => DOWN[d]).join(', ');
  return `Every ${t.interval} days`;
}

/* ---------- focus mode ---------- */
const F = {idx: 0, sec: 1500, run: false, iv: null};
const focusList = () => ensureDay(todayStr()).tasks.filter(k => !k.done).sort(byTime);
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function openFocus() { F.idx = 0; $('#focus').classList.remove('hidden'); document.body.classList.add('lock'); renderFocus(); }
function closeFocus() { clearInterval(F.iv); F.run = false; $('#focus').classList.add('hidden'); document.body.classList.remove('lock'); render(); }
function renderFocus() {
  const list = focusList(), el = $('#focus');
  if (!list.length) { el.innerHTML = `<h1>🎉 Nothing left to focus on</h1><p class="muted">All of today's tasks are done.</p><div class="row end"><button class="btn primary" data-act="fexit">Exit focus mode</button></div>`; return; }
  F.idx = F.idx % list.length; const k = list[F.idx], c = catOf(k.cat);
  el.innerHTML = `<span class="chip" style="--c:${esc(c.color)}">${esc(c.name)}</span><h1>${esc(k.title)}</h1>${k.desc ? `<p class="muted">${esc(k.desc)}</p>` : ''}
   <p class="muted">${k.time ? fmt12(k.time) + ' · ' : ''}Task ${F.idx + 1} of ${list.length}</p><div class="ftimer" id="fTimer">${mmss(F.sec)}</div>
   <div class="btns" style="justify-content:center"><button class="btn" data-act="ftoggle">${F.run ? 'Pause' : 'Start timer'}</button><button class="btn" data-act="freset">Reset</button></div>
   <div class="btns" style="justify-content:center;margin-top:16px"><button class="btn primary" data-act="fdone" data-id="${k.id}">${ic('check')}Mark done</button><button class="btn" data-act="fskip">Skip</button><button class="btn" data-act="fexit">Exit</button></div>`;
}
function ftick() {
  if (!F.run) return; F.sec--; const e = $('#fTimer'); if (e) e.textContent = mmss(F.sec);
  if (F.sec <= 0) { F.run = false; clearInterval(F.iv); F.sec = 1500; toast('Focus session complete. Take a short break!'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} renderFocus(); }
}

/* ---------- clock & daily reset ---------- */
function tick() {
  const p = nowParts(), d = `${p.year}-${p.month}-${p.day}`;
  if (d !== lastDate) {              // a new day began: build a fresh list
    lastDate = d; ensureDay(d); ui.cal = {y: +d.slice(0, 4), m: +d.slice(5, 7) - 1}; ui.sel = d;
    render(); toast('New day! Your fresh task list is ready ✨'); return;
  }
  const c = $('#clock'); if (c) { const h = +p.hour; c.textContent = `${h % 12 || 12}:${p.minute}:${p.second} ${h < 12 ? 'AM' : 'PM'}`; }
  const g = $('#hello'); if (g) g.textContent = greetText();
  if (p.second === '00' && ui.view === 'today' && $('#modal').classList.contains('hidden')) renderLists();
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ---------- actions ---------- */
const todayTask = id => ensureDay(todayStr()).tasks.find(k => k.id === id);
const ACT = {
  close: closeModal,
  add: () => taskModal({mode: 'add'}),
  focus: openFocus,
  yday: ydayModal,
  tab: id => { ui.tab = id; renderLists(); },
  done: (id, b) => {
    const el = b.closest('.task'); if (el) el.classList.add('leaving');
    setTimeout(() => { const k = todayTask(id); if (k) { k.done = true; k.doneAt = Date.now(); delete k.cleared; save(); } renderStats(); renderLists(); }, 280);
  },
  undo: id => { const k = todayTask(id); if (k) { k.done = false; delete k.doneAt; delete k.cleared; save(); renderStats(); renderLists(); toast('Task moved back to Active'); } },
  edit: id => { const k = todayTask(id); if (k) taskModal({mode: 'edit-task', task: k}); },
  del: id => confirmBox('Delete this task from today?', 'Delete', () => { const d = ensureDay(todayStr()); d.tasks = d.tasks.filter(k => k.id !== id); save(); renderStats(); renderLists(); }),
  clear: () => confirmBox("Hide all completed tasks from today's Completed list? They stay saved in History and still count toward today's progress.", 'Clear', () => { ensureDay(todayStr()).tasks.forEach(k => { if (k.done) k.cleared = true; }); save(); renderLists(); toast('Completed list cleared'); }),
  'tc-toggle': id => { const t = todayStr(), c = S.checklist.checks[t] || (S.checklist.checks[t] = {}); c[id] = !c[id]; save(); renderTrading($('#main')); },
  'tc-edit': id => { const i = S.checklist.items.find(x => x.id === id); if (i) askText('Edit checklist item', i.text, v => { i.text = v; save(); render(); }); },
  'tc-del': id => confirmBox('Delete this checklist item?', 'Delete', () => { S.checklist.items = S.checklist.items.filter(x => x.id !== id); save(); render(); }),
  'tc-reset': () => { S.checklist.checks[todayStr()] = {}; save(); render(); },
  'cal-prev': () => { ui.cal.m--; if (ui.cal.m < 0) { ui.cal.m = 11; ui.cal.y--; } render(); },
  'cal-next': () => { ui.cal.m++; if (ui.cal.m > 11) { ui.cal.m = 0; ui.cal.y++; } render(); },
  'cal-day': id => { ui.sel = id; render(); },
  'tpl-add': () => taskModal({mode: 'add', rep: 'daily'}),
  'tpl-edit': id => { const t = S.templates.find(x => x.id === id); if (t) taskModal({mode: 'edit-tpl', task: t}); },
  'tpl-del': id => confirmBox('Stop this recurring task? Tasks already created stay in your history.', 'Delete', () => { S.templates = S.templates.filter(x => x.id !== id); save(); render(); }),
  'cat-edit': id => {
    const c = S.categories.find(x => x.id === id); if (!c) return;
    openModal(`<h3>Edit category</h3><form id="mForm"><div class="row"><input name="name" maxlength="30" value="${esc(c.name)}" required><input type="color" name="color" value="${esc(c.color)}"></div><div class="row end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save</button></div></form>`);
    $('#mForm').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target); c.name = fd.get('name').trim() || c.name; c.color = fd.get('color'); save(); closeModal(); render(); };
  },
  'cat-del': id => {
    if (S.categories.length <= 1) { toast('Keep at least one category'); return; }
    confirmBox('Delete this category? Tasks using it will show as "Uncategorized".', 'Delete', () => { S.categories = S.categories.filter(x => x.id !== id); save(); render(); });
  },
  export: async () => {
    const text = JSON.stringify(S, null, 2), name = `dailyflow-backup-${todayStr()}.json`;
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({filename: name, data: text}); toast('Backup saved'); return; }
    } catch (e) { if (e && e.code === 'declined') { toast('Backup cancelled'); return; } }
    const blob = new Blob([text], {type: 'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup downloaded');
  },
  import: () => $('#file').click(),
  reset: () => confirmBox('This permanently erases ALL tasks, history and settings from this browser. Export a backup first if unsure.', 'Erase everything', () => {
    S = defaults(); S.seeded = true; save(); ensureDay(todayStr()); render(); toast('All data erased');
  }),
  ftoggle: () => { F.run = !F.run; clearInterval(F.iv); if (F.run) F.iv = setInterval(ftick, 1000); renderFocus(); },
  freset: () => { F.sec = 1500; F.run = false; clearInterval(F.iv); renderFocus(); },
  fskip: () => { F.idx++; renderFocus(); },
  fdone: id => { const k = todayTask(id); if (k) { k.done = true; k.doneAt = Date.now(); delete k.cleared; save(); } toast('Nice work! ✅'); renderFocus(); },
  fexit: closeFocus
};
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const b = e.target.closest('[data-act],[data-nav]'); if (!b) return;
  if (b.dataset.nav) { ui.view = b.dataset.nav; if (ui.view === 'history') ui.sel = ui.sel || todayStr(); render(); window.scrollTo(0, 0); return; }
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset.id, b, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; renderLists(); }
  if (e.target.id === 'nameIn') { S.name = e.target.value.trim(); save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'fcat') { ui.cat = e.target.value; renderLists(); }
  if (e.target.id === 'fpri') { ui.pri = e.target.value; renderLists(); }
  if (e.target.id === 'file') {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result); if (!d || typeof d.days !== 'object' || !Array.isArray(d.categories)) throw new Error('bad');
        confirmBox('Replace ALL current data with this backup?', 'Import', () => { S = normalize(d); S.seeded = true; save(); ensureDay(todayStr()); render(); toast('Backup imported'); });
      } catch (err) { toast('That file is not a valid DailyFlow backup'); }
    };
    r.readAsText(f);
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'tcForm') { e.preventDefault(); const v = new FormData(e.target).get('v').trim(); if (!v) return; S.checklist.items.push({id: uid(), text: v}); save(); render(); }
  if (e.target.id === 'catForm') { e.preventDefault(); const fd = new FormData(e.target); S.categories.push({id: uid(), name: fd.get('name').trim(), color: fd.get('color')}); save(); render(); toast('Category added'); }
});

/* ---------- start ---------- */
if (!S.seeded) { seed(); setTimeout(() => toast('Sample routine added. Edit or delete anything!'), 600); }
ensureDay(todayStr());
buildNav(); render();
window.__dailyflow = {get S() { return S; }, ensureDay, dayStats, streak, matches, todayStr, ACT, ui};   // handy for debugging

/* offline support: works when the page is served from a web address (https or localhost) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
